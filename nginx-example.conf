# /etc/nginx/sites-available/shop  (then: certbot --nginx -d shop.yourdomain.com)
server {
    listen 80;
    server_name shop.yourdomain.com;
    client_max_body_size 20m;          # profile photos, backup restore uploads

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;      # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
